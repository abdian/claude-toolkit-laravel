<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <defs>
    <radialGradient id="warm4" cx="24%" cy="12%" r="98%">
      <stop offset="0" stop-color="#241E18"/>
      <stop offset="1" stop-color="#110E0B"/>
    </radialGradient>
    <filter id="grain4">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="700" fill="url(#warm4)"/>
  <rect width="1280" height="700" filter="url(#grain4)" opacity="0.6"/>
  <line x1="92" y1="0" x2="92" y2="700" stroke="#2E2720" stroke-width="1"/>

  <text x="124" y="74" font-family="Georgia,serif" font-size="38" font-weight="bold" fill="#F1EADD">Inside the CODE column</text>
  <text x="124" y="108" font-family="Consolas,monospace" font-size="14.5" fill="#8C8071">Every AI coding tool competes here. Who actually does what — and how hard it lands.</text>

  <!-- column heads -->
  <g font-family="Consolas,monospace" font-size="12" fill="#6A6153" letter-spacing="2">
    <text x="470" y="166">WHAT IT CHANGES</text>
    <text x="810" y="166">HOW IT LANDS</text>
    <text x="1072" y="166">LARAVEL-AWARE</text>
  </g>
  <line x1="124" y1="182" x2="1188" y2="182" stroke="#3A322A" stroke-width="1"/>

  <!-- row 1 -->
  <text x="124" y="228" font-family="Georgia,serif" font-size="21" font-weight="bold" fill="#F1EADD">claude-toolkit-laravel</text>
  <text x="124" y="252" font-family="Consolas,monospace" font-size="12.5" fill="#6A6153">/lazy · CLAUDE.md</text>
  <text x="470" y="232" font-family="Consolas,monospace" font-size="14" fill="#C6BCAB">7-rung ladder + conventions</text>
  <text x="810" y="232" font-family="Consolas,monospace" font-size="14" fill="#E2A03A">text the model reads</text>
  <text x="810" y="254" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#8C6A38">weakest enforcement</text>
  <text x="1072" y="232" font-family="Consolas,monospace" font-size="17" fill="#5FAE7F">yes</text>
  <text x="1072" y="254" font-family="Consolas,monospace" font-size="12" fill="#6A6153">casts · Gate::before</text>
  <line x1="124" y1="282" x2="1188" y2="282" stroke="#2A241E" stroke-width="1"/>

  <!-- row 2 -->
  <text x="124" y="328" font-family="Georgia,serif" font-size="21" font-weight="bold" fill="#F1EADD">ponytail</text>
  <text x="124" y="352" font-family="Consolas,monospace" font-size="12.5" fill="#6A6153">/ponytail</text>
  <text x="470" y="332" font-family="Consolas,monospace" font-size="14" fill="#C6BCAB">the same 7 rungs, generic</text>
  <text x="810" y="332" font-family="Consolas,monospace" font-size="14" fill="#5FAE7F">lifecycle hook</text>
  <text x="810" y="354" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#4A8A64">fires at the tool call</text>
  <text x="1072" y="332" font-family="Consolas,monospace" font-size="17" fill="#8C8071">no</text>
  <line x1="124" y1="382" x2="1188" y2="382" stroke="#2A241E" stroke-width="1"/>

  <!-- row 3 -->
  <text x="124" y="428" font-family="Georgia,serif" font-size="21" font-weight="bold" fill="#F1EADD">Laravel Boost</text>
  <text x="124" y="452" font-family="Consolas,monospace" font-size="12.5" fill="#6A6153">composer, by Laravel</text>
  <text x="470" y="432" font-family="Consolas,monospace" font-size="14" fill="#C6BCAB">idioms · N+1 · caching · security</text>
  <text x="810" y="432" font-family="Consolas,monospace" font-size="14" fill="#5FAE7F">skills + MCP docs</text>
  <text x="810" y="454" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#4A8A64">version-accurate answers</text>
  <text x="1072" y="432" font-family="Consolas,monospace" font-size="17" fill="#5FAE7F">yes</text>
  <text x="1072" y="454" font-family="Consolas,monospace" font-size="12" fill="#6A6153">it is the framework's</text>
  <line x1="124" y1="482" x2="1188" y2="482" stroke="#2A241E" stroke-width="1"/>

  <!-- row 4 -->
  <text x="124" y="528" font-family="Georgia,serif" font-size="21" font-weight="bold" fill="#8C8071">CLAUDE.md alone</text>
  <text x="124" y="552" font-family="Consolas,monospace" font-size="12.5" fill="#5E554A">the usual setup</text>
  <text x="470" y="532" font-family="Consolas,monospace" font-size="14" fill="#8C8071">whatever you wrote</text>
  <text x="810" y="532" font-family="Consolas,monospace" font-size="14" fill="#E24E3A">read once, then buried</text>
  <text x="810" y="554" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#9A4438">never verified</text>
  <text x="1072" y="532" font-family="Consolas,monospace" font-size="15" fill="#6A6153">up to you</text>
  <line x1="124" y1="582" x2="1188" y2="582" stroke="#3A322A" stroke-width="1"/>

  <!-- the takeaway -->
  <text x="124" y="626" font-family="Georgia,serif" font-size="19" font-style="italic" fill="#C6BCAB">The ladders are the same idea. Only one of them knows what `casts` is —</text>
  <text x="124" y="654" font-family="Georgia,serif" font-size="19" font-style="italic" fill="#C6BCAB">and only one of them fires at the moment the file gets written.</text>
  <text x="124" y="684" font-family="Consolas,monospace" font-size="13.5" fill="#E24E3A">Run both and let exactly one own the lite/full/ultra/off mode, or they disagree in silence.</text>
</svg>
